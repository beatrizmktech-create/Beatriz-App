<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina da Casa</title>
<meta name="theme-color" content="#e7e3dd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Lexend:wght@500;600;700&display=swap">
<script>
  // Tema antes de pintar a tela: "sistema" segue o celular; claro/escuro forçam.
  try { const t = JSON.parse(localStorage.getItem("rotina-da-casa:tema") || '"sistema"'); if (t !== "sistema") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">

<div class="wrap">
  <header class="top">
    <div class="flex items-center gap-2">
      <div class="pessoas flex-1" role="group" aria-label="De quem é a rotina">
        <button class="pessoa" data-p="a" id="btn-a" aria-pressed="true"><span class="dot"></span><span id="nome-a">Perfil A</span></button>
        <button class="pessoa" data-p="b" id="btn-b" aria-pressed="false"><span class="dot"></span><span id="nome-b">Perfil B</span></button>
      </div>
      <button class="iconbtn" id="tema" aria-label="Tema: igual ao celular" title="Trocar tema"></button>
    </div>
    <div class="datebar" id="datebar">
      <button class="iconbtn" id="dia-ant" aria-label="Dia anterior">‹</button>
      <button class="when rounded-2xl py-1" id="dia-hoje" aria-label="Voltar para hoje"><strong id="data-txt">—</strong><span class="small muted" id="data-sub"></span></button>
      <button class="iconbtn" id="dia-prox" aria-label="Próximo dia">›</button>
    </div>
  </header>

  <main id="view" class="entra"></main>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite">
  <span id="toast-txt" class="min-w-0"></span>
  <button id="toast-ok">Ok</button>
</div>

<nav class="tabs" aria-label="Seções">
  <button data-tab="hoje" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>Hoje</button>
  <button data-tab="treino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treino</button>
  <button data-tab="dieta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 3h6"/></svg>Dieta</button>
  <button data-tab="compras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Compras</button>
  <button data-tab="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plano</button>
</nav>

<script src="plano.js"></script>
<script src="app.js"></script>
